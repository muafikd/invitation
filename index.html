<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Приглашение в кино</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="card">
      <p class="emoji">🎬💗🍿</p>
      <h1>Пойдешь со мной на кино-свидание?</h1>
      <p class="subtitle">
        Обещаю уютную атмосферу, вкусный попкорн и самые теплые объятия.
      </p>

      <div class="buttons">
        <button class="btn btn-yes" id="yesBtn">Да 💕</button>
        <button class="btn btn-no" id="noBtn">Нет</button>
      </div>

      <p class="answer-hint" id="answerHint"></p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
